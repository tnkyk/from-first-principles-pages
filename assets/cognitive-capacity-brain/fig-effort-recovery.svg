<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="effort recovery cycle">
  <rect width="720" height="300" fill="#1e201e"/>
  <text x="24" y="36" fill="#f2f3f0" font-family="Georgia, serif" font-size="18" font-weight="600">努力 → 負荷 → 回復／累積</text>
  <rect x="40" y="80" width="130" height="70" rx="4" fill="#151716" stroke="#35d0bb" stroke-width="2"/>
  <text x="80" y="120" fill="#f2f3f0" font-family="Georgia, serif" font-size="14">努力</text>
  <path d="M180 115 H220" stroke="#35d0bb" stroke-width="2"/>
  <polygon points="220,110 232,115 220,120" fill="#35d0bb"/>
  <rect x="240" y="80" width="140" height="70" rx="4" fill="#151716" stroke="#393b38" stroke-width="2"/>
  <text x="265" y="120" fill="#f2f3f0" font-family="Georgia, serif" font-size="14">負荷反応</text>
  <path d="M390 100 H430" stroke="#35d0bb" stroke-width="2"/>
  <polygon points="430,95 442,100 430,105" fill="#35d0bb"/>
  <path d="M390 130 H430" stroke="#c2c3bf" stroke-width="2"/>
  <polygon points="430,125 442,130 430,135" fill="#c2c3bf"/>
  <rect x="450" y="55" width="230" height="60" rx="4" fill="#151716" stroke="#35d0bb" stroke-width="2"/>
  <text x="480" y="80" fill="#f2f3f0" font-family="Georgia, serif" font-size="13">需要停止・心理的離脱</text>
  <text x="520" y="100" fill="#a9aaa5" font-family="Georgia, serif" font-size="12">→ 回復</text>
  <rect x="450" y="135" width="230" height="60" rx="4" fill="#151716" stroke="#393b38" stroke-width="2"/>
  <text x="475" y="160" fill="#f2f3f0" font-family="Georgia, serif" font-size="13">需要継続／睡眠不足</text>
  <text x="510" y="180" fill="#a9aaa5" font-family="Georgia, serif" font-size="12">→ 累積</text>
  <rect x="120" y="220" width="480" height="45" rx="4" fill="#151716" stroke="#35d0bb" stroke-width="2"/>
  <text x="160" y="248" fill="#f2f3f0" font-family="Georgia, serif" font-size="13">慢性のアロスタティック負荷は、日次回復とは別問題として残る</text>
  <text x="24" y="290" fill="#a9aaa5" font-family="Georgia, serif" font-size="12">教育用模式図 / Meijman and Mulder / Sonnentag and Fritz / McEwen</text>
</svg>
