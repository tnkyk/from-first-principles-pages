<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="combinatorial productivity">
  <rect width="720" height="280" fill="#1e201e"/>
  <text x="24" y="36" fill="#f2f3f0" font-family="Georgia, serif" font-size="18" font-weight="600">語彙在庫から組み合わせへ</text>
  <rect x="40" y="70" width="180" height="100" rx="4" fill="#151716" stroke="#393b38" stroke-width="2"/>
  <text x="70" y="115" fill="#f2f3f0" font-family="Georgia, serif" font-size="14">語彙在庫</text>
  <text x="70" y="140" fill="#a9aaa5" font-family="Georgia, serif" font-size="12">わんわん / きた / もっと</text>
  <path d="M240 120 H290" stroke="#35d0bb" stroke-width="3"/>
  <polygon points="290,115 302,120 290,125" fill="#35d0bb"/>
  <rect x="310" y="70" width="180" height="100" rx="4" fill="#151716" stroke="#35d0bb" stroke-width="2"/>
  <text x="340" y="115" fill="#f2f3f0" font-family="Georgia, serif" font-size="14">二語結合</text>
  <text x="340" y="140" fill="#a9aaa5" font-family="Georgia, serif" font-size="12">わんわん きた</text>
  <path d="M510 120 H560" stroke="#35d0bb" stroke-width="3"/>
  <polygon points="560,115 572,120 560,125" fill="#35d0bb"/>
  <rect x="580" y="70" width="120" height="100" rx="4" fill="#151716" stroke="#35d0bb" stroke-width="2"/>
  <text x="600" y="115" fill="#f2f3f0" font-family="Georgia, serif" font-size="14">新文</text>
  <text x="600" y="140" fill="#a9aaa5" font-family="Georgia, serif" font-size="12">未聞の状況</text>
  <text x="40" y="210" fill="#c2c3bf" font-family="Georgia, serif" font-size="13">語数だけでは測れない拡張: 部品の再利用（生産性）</text>
  <text x="40" y="240" fill="#a9aaa5" font-family="Georgia, serif" font-size="12">単語カード偏重は在庫を増やしても結合を置換しうる</text>
  <text x="24" y="270" fill="#a9aaa5" font-family="Georgia, serif" font-size="12">教育用模式図 / 使用基盤の発達記述に基づく再構成</text>
</svg>
