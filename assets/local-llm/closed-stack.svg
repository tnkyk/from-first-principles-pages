<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="閉模型体験の作業スタック">
  <rect width="720" height="300" fill="#f2f3f0"/>
  <text x="28" y="36" fill="#1a1c1a" font-family="Georgia, serif" font-size="18" font-weight="600">閉模型体験の作業スタック</text>

  <rect x="40" y="60" width="150" height="50" rx="6" fill="#fff" stroke="#393b38" stroke-width="2"/>
  <text x="55" y="90" fill="#1a1c1a" font-family="Georgia, serif" font-size="14">UI / 口調</text>
  <rect x="40" y="120" width="150" height="50" rx="6" fill="#fff" stroke="#0d7a6c" stroke-width="2"/>
  <text x="55" y="150" fill="#0d7a6c" font-family="Georgia, serif" font-size="14">道具・検索</text>
  <rect x="40" y="180" width="150" height="50" rx="6" fill="#fff" stroke="#0d7a6c" stroke-width="2"/>
  <text x="55" y="210" fill="#0d7a6c" font-family="Georgia, serif" font-size="14">考える時間</text>
  <rect x="40" y="240" width="150" height="40" rx="6" fill="#fff" stroke="#393b38" stroke-width="2"/>
  <text x="55" y="265" fill="#1a1c1a" font-family="Georgia, serif" font-size="14">基底モデル</text>
  <text x="220" y="100" fill="#4a4c48" font-family="Georgia, serif" font-size="14">閉模型 API の体験は、これらが束ねられた結果</text>
  <text x="220" y="140" fill="#4a4c48" font-family="Georgia, serif" font-size="14">ローカル代替は「同じ束」を再現するか、</text>
  <text x="220" y="168" fill="#4a4c48" font-family="Georgia, serif" font-size="14">どの層を外側へ残すかの設計問題になる</text>
  <text x="220" y="220" fill="#4a4c48" font-family="Georgia, serif" font-size="13">教育用模式図 · Apple AFM の on-device/server 役割分担に着想</text>

  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d7a6c"/></marker></defs>
</svg>
