<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="総パラメータと活性パラメータ">
  <rect width="720" height="280" fill="#f2f3f0"/>
  <text x="28" y="36" fill="#1a1c1a" font-family="Georgia, serif" font-size="18" font-weight="600">総パラメータと活性パラメータ</text>

  <rect x="40" y="70" width="220" height="120" rx="6" fill="#fff" stroke="#393b38" stroke-width="2"/>
  <text x="55" y="100" fill="#1a1c1a" font-family="Georgia, serif" font-size="14">総パラメータ</text>
  <text x="55" y="130" fill="#4a4c48" font-family="Georgia, serif" font-size="13">ディスク／常駐の上限</text>
  <text x="55" y="155" fill="#4a4c48" font-family="IBM Plex Mono, monospace" font-size="12">例: MoE 47B</text>
  <rect x="300" y="90" width="200" height="80" rx="6" fill="#fff" stroke="#0d7a6c" stroke-width="2"/>
  <text x="315" y="125" fill="#0d7a6c" font-family="Georgia, serif" font-size="14">活性パラメータ</text>
  <text x="315" y="150" fill="#4a4c48" font-family="IBM Plex Mono, monospace" font-size="12">例: top-2 ≈ 13B</text>
  <text x="40" y="230" fill="#4a4c48" font-family="Georgia, serif" font-size="14">統合メモリは「VRAM 分離」前提の見積もりを崩す。KV 共有は別軸の削減。</text>
  <text x="40" y="258" fill="#4a4c48" font-family="Georgia, serif" font-size="12">教育用模式図 · Mixtral / Apple AFM KV-cache sharing</text>

  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d7a6c"/></marker></defs>
</svg>
