<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="KV キャッシュの線形成長">
  <rect width="720" height="260" fill="#f2f3f0"/>
  <text x="28" y="36" fill="#1a1c1a" font-family="Georgia, serif" font-size="18" font-weight="600">KV キャッシュの線形成長</text>

  <text x="40" y="80" fill="#4a4c48" font-family="Georgia, serif" font-size="14">KV サイズ ∝ 層数 × KVヘッド × d × 系列長 × 精度</text>
  <rect x="40" y="110" width="120" height="80" rx="6" fill="#fff" stroke="#393b38" stroke-width="2"/>
  <text x="55" y="145" fill="#1a1c1a" font-family="Georgia, serif" font-size="13">重み</text>
  <text x="55" y="168" fill="#4a4c48" font-family="Georgia, serif" font-size="12">ほぼ固定</text>
  <rect x="200" y="100" width="80" height="100" rx="6" fill="#fff" stroke="#0d7a6c" stroke-width="2"/>
