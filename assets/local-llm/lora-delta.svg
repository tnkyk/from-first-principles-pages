<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="低ランクデルタ（LoRA）">
  <rect width="720" height="280" fill="#f2f3f0"/>
  <text x="28" y="36" fill="#1a1c1a" font-family="Georgia, serif" font-size="18" font-weight="600">低ランクデルタ（LoRA）</text>

  <rect x="40" y="80" width="140" height="100" rx="6" fill="#fff" stroke="#393b38" stroke-width="2"/>
  <text x="60" y="125" fill="#1a1c1a" font-family="Georgia, serif" font-size="16">W₀</text>
  <text x="55" y="155" fill="#4a4c48" font-family="Georgia, serif" font-size="12">凍結</text>
  <text x="200" y="125" fill="#0d7a6c" font-family="Georgia, serif" font-size="28">+</text>
  <rect x="240" y="70" width="100" height="50" rx="6" fill="#fff" stroke="#0d7a6c" stroke-width="2"/>
  <text x="275" y="100" fill="#0d7a6c" font-family="Georgia, serif" font-size="16">B</text>
  <rect x="240" y="140" width="100" height="50" rx="6" fill="#fff" stroke="#0d7a6c" stroke-width="2"/>
  <text x="275" y="170" fill="#0d7a6c" font-family="Georgia, serif" font-size="16">A</text>
  <text x="360" y="125" fill="#0d7a6c" font-family="Georgia, serif" font-size="28">→</text>
  <rect x="410" y="80" width="160" height="100" rx="6" fill="#fff" stroke="#0d7a6c" stroke-width="2"/>
  <text x="435" y="125" fill="#0d7a6c" font-family="Georgia, serif" font-size="15">W₀ + BA</text>
  <text x="430" y="155" fill="#4a4c48" font-family="Georgia, serif" font-size="12">マージ可</text>
  <text x="40" y="220" fill="#4a4c48" font-family="Georgia, serif" font-size="14">ΔW を低ランクで近似。起源は LLM（Hu et al., 2021）。画像側は差し替え運用を普及させた。</text>
  <text x="40" y="250" fill="#4a4c48" font-family="Georgia, serif" font-size="12">教育用模式図 · LoRA 原著の更新式</text>

  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d7a6c"/></marker></defs>
</svg>
